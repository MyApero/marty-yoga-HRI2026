# Coach gestures per Lucy robot package.
# Each gesture moves joints to angle * scale + offset (degrees, offset defaults to 0).
# shortcut: signs and scales are eyeballed in the 3D view, check them on the real robot.

[marty_urdf]
eyes = [{ joint = "eye_left_joint", scale = -1.0 }]
"left arm" = [{ joint = "arm_left_joint", scale = -1.307692308 }]
"right arm" = [{ joint = "arm_right_joint", scale = -1.307692308 }]
"left hip" = [{ joint = "leg_left_thigh_joint", scale = 1.0 }]
"right hip" = [{ joint = "leg_right_thigh_joint", scale = 1.0 }]
"left twist" = [{ joint = "leg_left_twist_joint", scale = 1.0 }]
"right twist" = [{ joint = "leg_right_twist_joint", scale = 1.0 }]
"left knee" = [{ joint = "leg_left_shin_joint", scale = 1.0 }]
"right knee" = [{ joint = "leg_right_shin_joint", scale = 1.0 }]

[reachy_mini_so101_humanoid_urdf]
eyes = [{ joint = "left_antenna", scale = 1.0 }, { joint = "right_antenna", scale = -1.0 }]
"left arm" = [{ joint = "l_arm_shoulder_lift", scale = 0.8, offset = -95.5 }]
"right arm" = [{ joint = "r_arm_shoulder_lift", scale = 0.8, offset = -95.5 }]
"left hip" = [{ joint = "l_leg_shoulder_lift", scale = 0.5, offset = -14.0 }]
"right hip" = [{ joint = "r_leg_shoulder_lift", scale = 0.5, offset = -14.0 }]
"left twist" = [{ joint = "l_leg_shoulder_pan", scale = 0.5 }]
"right twist" = [{ joint = "r_leg_shoulder_pan", scale = 0.5 }]
"left knee" = [{ joint = "l_leg_elbow_flex", scale = 0.5, offset = -73.8 }]
"right knee" = [{ joint = "r_leg_elbow_flex", scale = 0.5, offset = -73.8 }]
[unitree_g1_urdf]
# Arm gestures swing around unitree_default's shoulder roll (poses/default/pose.toml).
"left arm" = [{ joint = "left_shoulder_roll_joint", scale = 1.0, offset = 10 }]
"right arm" = [{ joint = "right_shoulder_roll_joint", scale = -1.0, offset = -10 }]
"left hip" = [{ joint = "left_hip_pitch_joint", scale = 0.5 }]
"right hip" = [{ joint = "right_hip_pitch_joint", scale = 0.5 }]
"left twist" = [{ joint = "left_hip_yaw_joint", scale = 0.5 }]
"right twist" = [{ joint = "right_hip_yaw_joint", scale = 0.5 }]
"left knee" = [{ joint = "left_knee_joint", scale = 0.5 }]
"right knee" = [{ joint = "right_knee_joint", scale = 0.5 }]
eyes = [{ joint = "waist_yaw_joint", scale = 0.5 }]

[unitree_r1_urdf]
"left arm" = [{ joint = "left_shoulder_roll_joint", scale = 1.0 }]
"right arm" = [{ joint = "right_shoulder_roll_joint", scale = -1.0 }]
"left hip" = [{ joint = "left_hip_pitch_joint", scale = 0.5 }]
"right hip" = [{ joint = "right_hip_pitch_joint", scale = 0.5 }]
"left twist" = [{ joint = "left_hip_yaw_joint", scale = 0.5 }]
"right twist" = [{ joint = "right_hip_yaw_joint", scale = 0.5 }]
"left knee" = [{ joint = "left_knee_joint", scale = 0.5 }]
"right knee" = [{ joint = "right_knee_joint", scale = 0.5 }]
eyes = [{ joint = "head_pitch_joint", scale = 0.5 }]
